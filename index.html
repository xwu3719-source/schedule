<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#4f46e5" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="课表" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect rx='22' width='100' height='100' fill='%234f46e5'/%3E%3Ctext x='50' y='66' text-anchor='middle' fill='white' font-size='50' font-weight='bold'%3E%E8%AF%BE%3C/text%3E%3C/svg%3E">
<link rel="manifest" href="/schedule/manifest.json">
<title>软件一班 · 极简课表</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--text:#182033;--muted:#6b7280;--line:#e5e7eb;--primary:#4f46e5;--primary2:#eef2ff;--green:#10b981;--orange:#f59e0b;--red:#ef4444;--shadow:0 12px 32px rgba(15,23,42,.08);}
*{box-sizing:border-box} body{margin:0;background:linear-gradient(180deg,#eef2ff 0,#f6f7fb 260px);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",Arial,sans-serif;color:var(--text)}

.app{max-width:1180px;margin:0 auto;padding:22px 16px 48px}
.hero{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;margin-bottom:18px}
.title h1{margin:0;font-size:28px;letter-spacing:-.5px}
.title p{margin:8px 0 0;color:var(--muted);font-size:14px}
.badge{background:rgba(255,255,255,.76);border:1px solid rgba(255,255,255,.8);padding:10px 14px;border-radius:18px;box-shadow:var(--shadow);white-space:nowrap;font-size:14px}
.filter-toggle{display:none;border:0;border-radius:16px;background:#111827;color:#fff;font-size:15px;font-weight:700;padding:13px 14px;box-shadow:var(--shadow);cursor:pointer}
.panel{background:rgba(255,255,255,.88);border:1px solid rgba(255,255,255,.92);border-radius:24px;box-shadow:var(--shadow);padding:14px;margin-bottom:16px}
.controls{display:grid;grid-template-columns:1.4fr 1fr 0.9fr auto;gap:12px;align-items:end}
.field label{display:block;font-size:12px;color:var(--muted);margin:0 0 6px 2px}
.field input,.field select{width:100%;height:42px;border:1px solid var(--line);border-radius:14px;padding:0 12px;background:#fff;font-size:15px;appearance:none;-webkit-appearance:none}
.field select{background-image:url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8'><path d='M1 1l5 5 5-5' stroke='%236b7280' stroke-width='2' fill='none'/></svg>");background-repeat:no-repeat;background-position:right 14px center;padding-right:32px}
.days{display:flex;gap:8px;flex-wrap:wrap}
.daybtn{border:1px solid var(--line);background:#fff;border-radius:999px;padding:10px 13px;cursor:pointer;font-size:14px;transition:all .15s}
.daybtn.active{background:var(--primary);color:white;border-color:var(--primary)}
.daybtn.today{border-color:var(--primary);color:var(--primary);font-weight:700}
.daybtn.today.active{color:white}
.daybtn.quick{background:#111827;color:#fff;border-color:#111827}
.daybtn.quick.active{background:var(--primary);border-color:var(--primary)}
.grid{display:grid;grid-template-columns:360px 1fr;gap:16px}
.today{position:sticky;top:12px;align-self:start;background:var(--card);border:1px solid var(--line);border-radius:24px;padding:16px;box-shadow:var(--shadow)}
.today h2,.weekview h2{margin:0 0 12px;font-size:18px}
.glance-title{font-size:13px;color:var(--muted);margin:2px 0 8px}
.week-glance{display:grid;gap:8px}
.glance-day{display:grid;grid-template-columns:42px 1fr;gap:8px;align-items:start;padding:9px;border:1px solid var(--line);border-radius:16px;background:#fff}
.glance-day.today-line{border-color:var(--primary);background:#f8f7ff}
.glance-day.next-line{border-color:var(--orange);background:#fffbeb}
.glance-day.now-line{border-color:var(--green);background:#f0fdf4}
.glance-name{font-weight:800;color:var(--primary);font-size:13px;line-height:1.4}
.glance-items{display:grid;gap:6px}
.glance-item{display:grid;grid-template-columns:66px minmax(0,1fr) auto;gap:6px;align-items:center;font-size:12px;line-height:1.35}
.glance-item.is-next{background:#fff7ed;border-radius:10px;padding:5px 0 5px 6px}
.glance-item.is-now{background:#ecfdf5;border-radius:10px;padding:5px 0 5px 6px}
.glance-time{color:var(--muted);font-variant-numeric:tabular-nums}
.glance-course{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.glance-room{color:#4338ca;background:#eef2ff;border:0;border-radius:999px;padding:3px 6px;font-weight:700;white-space:nowrap;cursor:pointer;font:inherit}
.glance-room:active,.pill.room:active{transform:translateY(1px)}
.muted{color:var(--muted)}
.weekview{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:16px;box-shadow:var(--shadow)}
.day-section{border-top:1px solid var(--line);padding:14px 0}
.day-section:first-of-type{border-top:0;padding-top:0}
.day-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.day-head h3{margin:0;font-size:18px}
.day-head h3.is-today{color:var(--primary)}
.course-list{display:grid;gap:10px}
.course{display:grid;grid-template-columns:82px 1fr auto;gap:12px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:18px;background:#fff;transition:border-color .15s,box-shadow .15s,opacity .15s}
.course.is-now{border-color:var(--green);box-shadow:0 8px 24px rgba(16,185,129,.14)}
.course.is-next{border-color:var(--orange);box-shadow:0 8px 24px rgba(245,158,11,.14)}
.course.is-done{opacity:.58}
.time{font-weight:700;color:var(--primary)}
.name{font-weight:700}
.meta{font-size:13px;color:var(--muted);margin-top:4px}
.statusline{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.pill{font-size:12px;border-radius:999px;padding:6px 9px;background:#f3f4f6;color:#374151;white-space:nowrap}
.pill.room{background:#eef2ff;color:#4338ca;font-weight:700;border:0;cursor:pointer;font:inherit}
.pill.status-now{background:#dcfce7;color:#166534}
.pill.status-next{background:#fffbeb;color:#92400e}
.pill.status-done{background:#f3f4f6;color:#6b7280}
.type-专业课{background:#ecfeff;color:#0e7490}
.type-公共课{background:#fef3c7;color:#92400e}
.type-英语{background:#f0fdf4;color:#166534}
.empty{padding:20px;border:1px dashed #cbd5e1;border-radius:18px;color:var(--muted);text-align:center}
.now-next{background:linear-gradient(135deg,#4f46e5,#7c3aed);color:#fff;border-radius:18px;padding:16px;margin-bottom:14px}
.now-next .nn-label{font-size:11px;opacity:.8;letter-spacing:1px;text-transform:uppercase;margin-bottom:6px}
.now-next .nn-course{font-size:18px;font-weight:800;margin-bottom:4px}
.now-next .nn-meta{font-size:13px;opacity:.9;line-height:1.5}
.now-next .nn-time{font-size:12px;opacity:.75;margin-top:6px}
.now-next.now{background:linear-gradient(135deg,#059669,#10b981)}
.now-next.next{background:linear-gradient(135deg,#d97706,#f59e0b)}
.now-next.done{background:linear-gradient(135deg,#6b7280,#9ca3af)}
.footer{margin-top:14px;font-size:12px;color:var(--muted);line-height:1.7}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(16px);opacity:0;background:#111827;color:#fff;padding:10px 14px;border-radius:999px;font-size:13px;box-shadow:var(--shadow);pointer-events:none;transition:opacity .18s,transform .18s;z-index:10}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.switch{height:42px;border:0;border-radius:14px;background:#111827;color:white;padding:0 14px;cursor:pointer;font-size:14px;transition:all .15s}
.switch.on{background:var(--primary)}
.week-hint{display:inline-block;margin-left:8px;font-size:13px;color:var(--primary);font-weight:600}
@media(max-width:850px){
  .app{display:flex;flex-direction:column;padding:18px 12px 36px}
  .hero{order:1}.today{order:2}.filter-toggle{display:block;order:3;margin-bottom:12px}.panel{order:4}.weekview{order:5}
  .hero{display:block}.badge{margin-top:12px;display:inline-block}
  .panel.is-collapsed{display:none}
  .controls{grid-template-columns:1fr}
  .grid{display:contents}.today{position:static;margin-bottom:16px}
  .course{grid-template-columns:72px 1fr}.course .pill{grid-column:2}
  .title h1{font-size:24px}
  .today{padding:14px}.weekview{padding:14px}
  .now-next{padding:18px}.now-next .nn-course{font-size:22px}
  .glance-day{grid-template-columns:38px 1fr;padding:8px}
  .glance-item{grid-template-columns:58px minmax(0,1fr) auto}
}
</style>
</head>
<body>
<div class="app">
  <div class="hero">
    <div class="title"><h1>软件一班 · 极简课表</h1><p>2026-2027学年第1学期｜24底_软件1（24116311）</p></div>
    <div class="badge" id="todayBadge">正在计算课表状态...</div>
  </div>
  <button class="filter-toggle" id="filterToggle">调整周次 / 筛选</button>
  <div class="panel controls is-collapsed" id="filters">
    <div class="field"><label>当前周 <span class="week-hint" id="weekHint"></span></label><select id="week"></select></div>
    <div class="field"><label>星期筛选</label><div class="days" id="days"></div></div>
    <div class="field"><label>课程类型</label><select id="type"><option value="all">全部课程</option><option value="专业课">专业课</option><option value="公共课">公共课</option><option value="英语">英语</option></select></div>
    <button class="switch on" id="onlyActive">只看本周</button>
  </div>
  <div class="grid">
    <aside class="today"><h2>📋 实时提醒</h2><div id="nowNext"></div><div id="summary"></div><div class="footer">提示：点周次就能看整周变化，下面保留详细课表。</div></aside>
    <main class="weekview"><h2 id="viewTitle">本周课表</h2><div id="schedule"></div></main>
  </div>
  <div class="toast" id="toast">已复制</div>
</div>
<script>
(function(){
const STORAGE_KEY='schedule_v1';
const SEMESTER_START=new Date(2026,7,31); // 8月31日 = 第1周周一

const days=['周一','周二','周三','周四','周五','周六','周日'];
const courses=[
{day:'周一',sec:'1-2',time:'8:20-9:55',name:'Digital Logic Circuits',cn:'数字逻辑',weeks:[6,13],room:'3-304',type:'专业课'},
{day:'周一',sec:'5-6',time:'14:00-15:35',name:'软件工程',cn:'软件工程',weeks:[1,5],room:'5B-404',type:'专业课'},
{day:'周一',sec:'5-6',time:'14:00-15:35',name:'Data Structure & Algorithms',cn:'数据结构',weeks:[6,13],room:'7A-215',type:'专业课'},
{day:'周一',sec:'7-8',time:'15:55-17:30',name:'计算机组成原理',cn:'计算机组成原理',weeks:[1,8],room:'5B-307',type:'专业课'},
{day:'周一',sec:'7-8',time:'15:55-17:30',name:'软件工程',cn:'软件工程',weeks:[9,12],room:'5B-307',type:'专业课'},
{day:'周一',sec:'9-10',time:'18:30-20:05',name:'JAVA',cn:'Java',weeks:[6,13],room:'7A-215',type:'专业课'},
{day:'周二',sec:'1-2',time:'8:20-9:55',name:'软件工程',cn:'软件工程',weeks:[1,10],room:'5B-307',type:'专业课'},
{day:'周二',sec:'3-4',time:'10:15-11:50',name:'习概',cn:'习概',weeks:[1,10],room:'2-107',type:'公共课'},
{day:'周二',sec:'5-6',time:'14:00-15:35',name:'JAVA',cn:'Java',weeks:[6,13],room:'7A-215',type:'专业课'},
{day:'周二',sec:'7-8',time:'15:55-17:30',name:'计算机组成原理',cn:'计算机组成原理',weeks:[1,7],room:'5B-307',type:'专业课'},
{day:'周二',sec:'7-8',time:'15:55-17:30',name:'计算机网络',cn:'计算机网络',weeks:[8,11],room:'3-402',type:'专业课'},
{day:'周二',sec:'9-10',time:'18:30-20:05',name:'形势与政策-5',cn:'形势与政策',weeks:[2,5],room:'工1-A002',type:'公共课'},
{day:'周三',sec:'1-2',time:'8:20-9:55',name:'Digital Logic Circuits',cn:'数字逻辑',weeks:[6,13],room:'3-201',type:'专业课'},
{day:'周三',sec:'5-6',time:'14:00-15:35',name:'计算机网络',cn:'计算机网络',weeks:[4,5],room:'2-111',type:'专业课'},
{day:'周三',sec:'5-6',time:'14:00-15:35',name:'Data Structure & Algorithms',cn:'数据结构',weeks:[6,13],room:'7A-215',type:'专业课'},
{day:'周三',sec:'7-8',time:'15:55-17:30',name:'算法分析与设计',cn:'算法分析',weeks:[1,8],room:'5B-404',type:'专业课'},
{day:'周三',sec:'9-11',time:'18:30-20:55',name:'大学生创业基础',cn:'创业基础',weeks:[1,11],room:'2-007',type:'公共课'},
{day:'周四',sec:'1-2',time:'8:20-9:55',name:'习概',cn:'习概',weeks:[1,10],room:'2-107',type:'公共课'},
{day:'周四',sec:'5-6',time:'14:00-15:35',name:'JAVA',cn:'Java',weeks:[6,13],room:'7A-215',type:'专业课'},
{day:'周四',sec:'7-8',time:'15:55-17:30',name:'Data Structure & Algorithms',cn:'数据结构',weeks:[6,13],room:'7A-215',type:'专业课'},
{day:'周四',sec:'9-10',time:'18:30-20:05',name:'Digital Logic Circuits',cn:'数字逻辑',weeks:[6,13],room:'3-201',type:'专业课'},
{day:'周五',sec:'1-2',time:'8:20-9:55',name:'学术英语写作',cn:'学术英语',weeks:[1,16],room:'7A-214',type:'英语'},
{day:'周五',sec:'3-4',time:'10:15-11:50',name:'计算机网络',cn:'计算机网络',weeks:[4,12],room:'2-503',type:'专业课'},
{day:'周五',sec:'7-8',time:'15:55-17:30',name:'算法分析与设计',cn:'算法分析',weeks:[1,8],room:'5B-304',type:'专业课'}
];

// ── 计算当前教学周 ──
function calcCurrentWeek(){
  const now=new Date();
  const diff=now-SEMESTER_START;
  const day=Math.floor(diff/(1000*60*60*24));
  const week=Math.floor(day/7)+1;
  if(week<1) return {week:1, hint:'(未开学)', phase:'before'};
  if(week>18) return {week:18, hint:'(已结课)', phase:'after'};
  return {week, hint:'(第'+week+'周)', phase:'active'};
}

// ── 今日星期几 ──
function todayDayName(){
  const d=new Date().getDay(); // 0=周日
  return d===0?'周日':days[d-1];
}

// ── localStorage 状态读写 ──
function loadState(){
  try{
    const raw=localStorage.getItem(STORAGE_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return {};
}
function saveState(s){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(s)); }catch(e){}
}

// 初始化状态
const saved=loadState();
const autoWeek=calcCurrentWeek();
let currentWeek=saved.week||autoWeek.week;
let activeDay=saved.day||'all';
let activeOnly=saved.activeOnly!==undefined?saved.activeOnly:true;
let typeFilter=saved.type||'all';

// 保存状态
function persist(){
  saveState({week:currentWeek, day:activeDay, activeOnly, type:typeFilter});
}

// ── DOM 引用 ──
const $week=document.getElementById('week');
const $hint=document.getElementById('weekHint');
const $days=document.getElementById('days');
const $type=document.getElementById('type');
const $only=document.getElementById('onlyActive');
const $filters=document.getElementById('filters');
const $filterToggle=document.getElementById('filterToggle');
const $viewTitle=document.getElementById('viewTitle');
const $schedule=document.getElementById('schedule');
const $summary=document.getElementById('summary');
const $nowNext=document.getElementById('nowNext');
const $todayBadge=document.getElementById('todayBadge');
const $toast=document.getElementById('toast');

// ── 初始化 week 下拉 ──
function formatDate(d){ return (d.getMonth()+1)+'/'+d.getDate(); }
function buildWeekOptions(){
  let html='';
  for(let w=1;w<=18;w++){
    const start=new Date(SEMESTER_START);
    start.setDate(start.getDate()+(w-1)*7);
    const end=new Date(start);
    end.setDate(end.getDate()+6);
    const sel=w===currentWeek?' selected':'';
    html+=`<option value="${w}"${sel}>第 ${w} 周（${formatDate(start)}-${formatDate(end)}）</option>`;
  }
  $week.innerHTML=html;
}
buildWeekOptions();
$hint.textContent=autoWeek.hint||'';
$type.value=typeFilter;

// ── 星期按钮 ──
const todayName=todayDayName();
[
  {label:'今天',value:todayName,quick:true},
  {label:'全部',value:'all'},
  ...days.map(d=>({label:d,value:d}))
].forEach(item=>{
  const b=document.createElement('button');
  b.className='daybtn';
  if(item.quick) b.classList.add('quick');
  const isActive=item.quick?activeDay===todayName:(item.value===activeDay&&!(activeDay===todayName&&item.value===todayName));
  if(isActive) b.classList.add('active');
  if(item.value===todayName&&!item.quick) b.classList.add('today');
  b.textContent=item.label;
  b.onclick=()=>{
    document.querySelectorAll('.daybtn').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');
    activeDay=item.value;
    persist();
    render();
  };
  $days.appendChild(b);
});

function syncDayButtons(){
  $days.querySelectorAll('.daybtn').forEach(btn=>{
    const isTodayBtn=btn.textContent==='今天';
    const value=isTodayBtn?todayName:(btn.textContent==='全部'?'all':btn.textContent);
    const isActive=isTodayBtn?activeDay===todayName:(value===activeDay&&!(activeDay===todayName&&value===todayName));
    btn.classList.toggle('active',isActive);
  });
}

$filterToggle.onclick=()=>{
  const collapsed=$filters.classList.toggle('is-collapsed');
  $filterToggle.textContent=collapsed?'调整周次 / 筛选':'收起筛选';
};

// ── 只看本周 ──
function updateToggleBtn(){
  $only.textContent=activeOnly?'只看本周':'显示全部';
  $only.className='switch'+(activeOnly?' on':'');
}
updateToggleBtn();
$only.onclick=()=>{
  activeOnly=!activeOnly;
  updateToggleBtn();
  persist();
  render();
};

// ── 事件绑定 ──
$week.onchange=function(){
  currentWeek=+this.value||1;
  persist();
  render();
};
$type.onchange=function(){
  typeFilter=this.value;
  persist();
  render();
};

// ── 工具 ──
function inWeek(c,w){return w>=c.weeks[0]&&w<=c.weeks[1]}
function secStart(s){return parseInt(s.split('-')[0])}
function dayIndex(d){return days.indexOf(d)}
function courseKey(c){return `${c.day}|${c.sec}|${c.name}|${c.room}`}
function sameCourse(a,b){return !!a&&!!b&&courseKey(a)===courseKey(b)}
function sortCourses(list){return list.sort((a,b)=>days.indexOf(a.day)-days.indexOf(b.day)||secStart(a.sec)-secStart(b.sec))}
function firstCourseOfWeek(w){return sortCourses(courses.filter(c=>inWeek(c,w)))[0]||null}

function courseStatus(c,w){
  const semester=calcCurrentWeek();
  if(!inWeek(c,w)) return {cls:'',label:''};
  if(semester.phase==='before'&&w===1&&sameCourse(c,firstCourseOfWeek(1))) return {cls:'is-next',label:'第一节',pill:'status-next'};
  if(semester.phase!=='active'||w!==semester.week||c.day!==todayName) return {cls:'',label:''};
  const now=new Date();
  const nowMin=now.getHours()*60+now.getMinutes();
  const [start,end]=parseTimeRange(c.time);
  if(nowMin>=start&&nowMin<end) return {cls:'is-now',label:'进行中',pill:'status-now'};
  const todayCourses=courses
    .filter(x=>x.day===todayName&&inWeek(x,w))
    .map(x=>({...x,start:parseTimeRange(x.time)[0]}))
    .sort((a,b)=>a.start-b.start);
  const next=todayCourses.find(x=>x.start>nowMin);
  if(next&&next.day===c.day&&next.sec===c.sec&&next.name===c.name) return {cls:'is-next',label:'下一节',pill:'status-next'};
  if(nowMin>=end) return {cls:'is-done',label:'已结束',pill:'status-done'};
  return {cls:'',label:''};
}

function courseHTML(c,w){
  const off=!inWeek(c,w);
  const status=courseStatus(c,w);
  const style=off?'opacity:.45':'';
  const statusHTML=status.label?`<span class="pill ${status.pill}">${status.label}</span>`:'';
  return `<div class="course ${status.cls}" style="${style}">
    <div class="time">${c.sec}节<br><span class="muted">${c.time}</span></div>
    <div>
      <div class="name">${c.cn}</div>
      <div class="meta">${c.name}｜${c.weeks[0]}-${c.weeks[1]}周${off?'｜非本周':''}</div>
      <div class="statusline">${statusHTML}<span class="pill type-${c.type}">${c.type}</span></div>
    </div>
    <button class="pill room" type="button" data-room="${c.room}">${c.room}</button>
  </div>`;
}

// ── 时间解析 & 实时提醒 ──
function parseTime(t){const [h,m]=t.split(':').map(Number);return h*60+m;}
function parseTimeRange(tr){const [s,e]=tr.split('-');return [parseTime(s),parseTime(e)];}
function formatWaitMinutes(min){
  if(min>=60) return `${Math.floor(min/60)}h${min%60}m`;
  return `${min} 分钟`;
}

function findNextCourseAcrossWeek(w){
  const now=new Date();
  const nowMin=now.getHours()*60+now.getMinutes();
  const todayIdx=dayIndex(todayDayName());
  const candidates=[];
  for(let offset=0;offset<=21;offset++){
    const absoluteDay=todayIdx+offset;
    const targetDay=days[absoluteDay%7];
    const targetWeek=w+Math.floor(absoluteDay/7);
    if(targetWeek>18) break;
    courses.forEach(c=>{
      if(c.day!==targetDay||!inWeek(c,targetWeek)) return;
      const start=parseTimeRange(c.time)[0];
      if(offset===0&&start<=nowMin) return;
      candidates.push({...c,start,offset,targetWeek});
    });
  }
  candidates.sort((a,b)=>a.offset-b.offset||a.start-b.start);
  return candidates[0]||null;
}

function findNowNext(){
  const now=new Date();
  const nowMin=now.getHours()*60+now.getMinutes();
  const today=todayDayName();
  const semester=calcCurrentWeek();
  const w=semester.week;
  if(semester.phase==='before'){
    const next=firstCourseOfWeek(1);
    return next?{state:'before', msg:'还没开学', next}: {state:'before', msg:'还没开学'};
  }
  if(semester.phase==='after') return {state:'after', msg:'本学期已结束'};
  if(today==='周六'||today==='周日'){
    const next=findNextCourseAcrossWeek(w);
    return next?{state:'weekend', msg:'周末没有课程', next}: {state:'weekend', msg:'周末没有课程'};
  }

  // 今天 + 本周的所有课程，按开始时间排序
  const todayCourses=courses.filter(c=>c.day===today&&inWeek(c,w));
  if(!todayCourses.length){
    const next=findNextCourseAcrossWeek(w);
    return next?{state:'empty', msg:'今天没有课程', next}: {state:'empty', msg:'今天没有课程'};
  }

  // 解析每门课的时间区间
  const withTime=todayCourses.map(c=>{
    const [s,e]=parseTimeRange(c.time);
    return {...c, start:s, end:e};
  }).sort((a,b)=>a.start-b.start);

  // 查找正在进行的课
  const ongoing=withTime.find(c=>nowMin>=c.start&&nowMin<c.end);
  if(ongoing){
    const remain=ongoing.end-nowMin;
    const remainStr=`还有 ${formatWaitMinutes(remain)}下课`;
    return {
      state:'now',
      course:ongoing,
      msg:`正在上课 · ${ongoing.cn}`,
      meta:`${ongoing.sec}节 ${ongoing.time}｜${ongoing.room}`,
      extra:remainStr
    };
  }

  // 查找下一节课
  const next=withTime.find(c=>c.start>nowMin);
  if(next){
    const wait=next.start-nowMin;
    const waitStr=`${formatWaitMinutes(wait)}后开始`;
    return {
      state:'next',
      course:next,
      msg:`即将上课 · ${next.cn}`,
      meta:`${next.sec}节 ${next.time}｜${next.room}`,
      extra:waitStr
    };
  }

  // 今天所有课都结束了
  const upcoming=findNextCourseAcrossWeek(w);
  return upcoming?{state:'done', msg:'今天课程已结束', next:upcoming}: {state:'done', msg:'今天课程已结束'};
}

function nowNextHTML(nn){
  const nnCls=nn.state==='now'?'now':(nn.state==='next'||nn.state==='before'?'next':'done');
  if(nn.state==='now'||nn.state==='next'){
    return `<div class="now-next ${nnCls}">
      <div class="nn-label">${nn.state==='now'?'🔴 正在进行':'🟡 即将开始'}</div>
      <div class="nn-course">${nn.course.cn}</div>
      <div class="nn-meta">${nn.meta}</div>
      <div class="nn-time">${nn.extra}</div>
    </div>`;
  }
  const weekText=nn.next&&nn.next.targetWeek?`第${nn.next.targetWeek}周 `:'';
  const beforeWeek=nn.state==='before'?'第1周 ':'';
  const nextLabel=nn.state==='before'?'第一节':'下一次';
  const nextHTML=nn.next?`<div class="nn-meta">${nextLabel}：${weekText||beforeWeek}${nn.next.day} ${nn.next.sec}节 ${nn.next.time}｜${nn.next.room}</div>`:'';
  return `<div class="now-next ${nnCls}">
    <div class="nn-label">${nn.state==='weekend'?'🌴 周末':(nn.state==='before'?'🟡 开学前':'📋 提醒')}</div>
    <div class="nn-course" style="font-size:17px">${nn.msg}</div>
    ${nextHTML}
  </div>`;
}

function weekGlanceHTML(w){
  const visibleCourses=courses
    .filter(c=>inWeek(c,w)&&(typeFilter==='all'||c.type===typeFilter))
    .sort((a,b)=>days.indexOf(a.day)-days.indexOf(b.day)||secStart(a.sec)-secStart(b.sec));
  const body=days.map(d=>{
    const arr=visibleCourses.filter(c=>c.day===d);
    const statuses=arr.map(c=>courseStatus(c,w));
    const dayClass=statuses.some(s=>s.cls==='is-now')?' now-line':(statuses.some(s=>s.cls==='is-next')?' next-line':'');
    if(!arr.length){
      return `<div class="glance-day${d===todayName?' today-line':''}" data-day="${d}">
        <div class="glance-name">${d}</div>
        <div class="muted" style="font-size:12px">无课</div>
      </div>`;
    }
    const items=arr.map(c=>{
      const status=courseStatus(c,w);
      const label=status.label?` · ${status.label}`:'';
      return `<div class="glance-item ${status.cls}">
      <span class="glance-time">${c.sec}节</span>
      <span class="glance-course">${c.cn}${label}</span>
      <button class="glance-room" type="button" data-room="${c.room}">${c.room}</button>
    </div>`;
    }).join('');
    return `<div class="glance-day${d===todayName?' today-line':''}${dayClass}" data-day="${d}">
      <div class="glance-name">${d}</div>
      <div class="glance-items">${items}</div>
    </div>`;
  }).join('');
  return `<div class="glance-title">本周一屏</div><div class="week-glance">${body}</div>`;
}

function showToast(text){
  $toast.textContent=text;
  $toast.classList.add('show');
  clearTimeout(showToast.timer);
  showToast.timer=setTimeout(()=>{$toast.classList.remove('show')},1400);
}

async function copyRoom(room){
  try{
    await navigator.clipboard.writeText(room);
    showToast(`已复制 ${room}`);
  }catch(e){
    showToast(room);
  }
}

document.addEventListener('click',e=>{
  const roomBtn=e.target.closest('[data-room]');
  if(roomBtn){
    e.stopPropagation();
    copyRoom(roomBtn.dataset.room);
    return;
  }
  const dayBox=e.target.closest('.glance-day[data-day]');
  if(dayBox){
    activeDay='all';
    persist();
    syncDayButtons();
    render();
    setTimeout(()=>{
      const target=document.querySelector(`[data-detail-day="${dayBox.dataset.day}"]`);
      if(target) target.scrollIntoView({behavior:'smooth',block:'start'});
    },0);
  }
});

// ── 渲染 ──
function render(){
  const w=currentWeek;
  let list=courses.filter(c=>(activeDay==='all'||c.day===activeDay)&&(typeFilter==='all'||c.type===typeFilter));
  if(activeOnly) list=list.filter(c=>inWeek(c,w));
  list.sort((a,b)=>days.indexOf(a.day)-days.indexOf(b.day)||secStart(a.sec)-secStart(b.sec));

  const active=courses.filter(c=>inWeek(c,w));
  $viewTitle.textContent=`第 ${w} 周课表${activeOnly?'':'（含非本周淡化）'}`;
  $todayBadge.textContent=`${autoWeek.hint.replace(/[()]/g,'')||'第 '+autoWeek.week+'周'}｜${todayName}｜打开看下一节`;

  let html='';
  days.forEach(d=>{
    const arr=list.filter(c=>c.day===d);
    if(arr.length){
      html+=`<section class="day-section">
        <div class="day-head" data-detail-day="${d}"><h3${d===todayName?' class="is-today"':''}>${d}${d===todayName?' · 今天':''}</h3><span class="pill">${arr.length} 节课</span></div>
        <div class="course-list">${arr.map(c=>courseHTML(c,w)).join('')}</div>
      </section>`;
    }
  });
  $schedule.innerHTML=html||'<div class="empty">这个筛选条件下没有课程。</div>';

  // ── 实时提醒卡片 ──
  const nn=findNowNext();
  $nowNext.innerHTML=nowNextHTML(nn);
  $summary.innerHTML=weekGlanceHTML(w);
}

render();
// 每 60 秒自动刷新实时提醒
setInterval(function(){
  render();
},60000);
})();
</script>
